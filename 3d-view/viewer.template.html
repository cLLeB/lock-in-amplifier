<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boards in their cases</title>
<style>
  :root { --bg: #eef1f5; --panel: #ffffff; --ink: #1d2330; --dim: #5b6576; --accent: #2f5fb3; --line: #d5dbe4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181f; --panel: #1d232d; --ink: #e8ecf2; --dim: #9aa5b6; --accent: #7aa4ef; --line: #2c3442; color-scheme: dark; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; }
  .panel { position: fixed; top: 12px; left: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 12px 14px; display: grid; gap: 10px; max-width: 300px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  h1 { font-size: 15px; margin: 0; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { flex: 1; padding: 7px 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 7px; cursor: pointer; font: inherit; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  label { display: grid; gap: 4px; color: var(--dim); font-size: 13px; }
  label.row { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .note { color: var(--dim); font-size: 12.5px; margin: 0; }
  [hidden] { display: none !important; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); }
</style>
</head>
<body>
<div id="view"></div>
<div id="loading">Loading the 3D models...</div>
<div class="panel">
  <h1>Boards in their cases</h1>
  <div class="tabs"><button id="t-socket" class="on">Smart socket</button><button id="t-lockin">Lock-in amplifier</button></div>
  <label>Lift the lid <input id="lift" type="range" min="0" max="60" value="0"></label>
  <label>Case see-through <input id="glass" type="range" min="15" max="100" value="100"></label>
  <label class="row"><input id="showLid" type="checkbox" checked> Lid</label>
  <label class="row"><input id="showBase" type="checkbox" checked> Base</label>
  <p class="note" id="about"></p>
  <p class="note">Drag to turn, right-drag to move, scroll to zoom.</p>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const DATA = { socket: "%%SOCKET%%", lockin: "%%LOCKIN%%" };
const ONLY = "%%ONLY%%";   // a page for one project only: no tabs
const ABOUT = {
  socket: "51 x 24 mm board. Charger socket at the left end, phone cable through the slot at the right end (open at the top, closed by the lid's tongue), XIAO USB-C in the front, LED through the lid. Antenna under the lid.",
  lockin: "90 x 60 mm board on four pins, 9 V battery in its bay, LED holder over the photodiode, meter window over J2 (OUT, VREF, GND)."
};

const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(80, 160, 120); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(-120, 60, -80); scene.add(fill);

const loader = new GLTFLoader();
const models = {};
let current = null;

function b64ToBuf(b64) {
  const bin = atob(b64); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}

function load(name) {
  return new Promise((ok, bad) => loader.parse(b64ToBuf(DATA[name]), "", g => {
    const root = new THREE.Group();
    g.scene.rotation.x = -Math.PI / 2;        // the files are z-up, three.js is y-up
    root.add(g.scene);
    const parts = {};
    g.scene.traverse(o => {
      if (o.isMesh) {
        o.material = o.material.clone();
        o.material.side = THREE.DoubleSide;
        if (o.material.vertexColors === false && o.geometry.attributes.color) o.material.vertexColors = true;
      }
      if (["base", "lid", "board", "extra"].includes(o.name)) parts[o.name] = o;
    });
    const box = new THREE.Box3().setFromObject(root);
    const c = box.getCenter(new THREE.Vector3());
    root.position.sub(c);
    ok({ root, parts, size: box.getSize(new THREE.Vector3()) });
  }, bad));
}

function apply() {
  if (!current) return;
  const m = models[current];
  const lift = +document.getElementById("lift").value;
  const glass = +document.getElementById("glass").value / 100;
  m.parts.lid.position.z = lift;            // lid node is in the z-up frame
  if (m.parts.extra && current === "lockin") m.parts.extra.position.z = 0;
  for (const k of ["base", "lid"]) {
    m.parts[k].traverse(o => { if (o.isMesh) { o.material.transparent = glass < 1; o.material.opacity = glass; o.material.depthWrite = glass >= 1; } });
  }
  m.parts.lid.visible = document.getElementById("showLid").checked;
  m.parts.base.visible = document.getElementById("showBase").checked;
}

async function show(name) {
  document.getElementById("t-socket").classList.toggle("on", name === "socket");
  document.getElementById("t-lockin").classList.toggle("on", name === "lockin");
  document.getElementById("about").textContent = ABOUT[name];
  if (!models[name]) models[name] = await load(name);
  if (current) scene.remove(models[current].root);
  current = name;
  const m = models[name];
  scene.add(m.root);
  const r = m.size.length();
  camera.position.set(r * 1.2, r * 1.0, r * 1.5);
  controls.target.set(0, 0, 0);
  controls.update();
  apply();
  document.getElementById("loading").hidden = true;
}

for (const id of ["lift", "glass", "showLid", "showBase"]) document.getElementById(id).addEventListener("input", apply);
document.getElementById("t-socket").onclick = () => show("socket");
document.getElementById("t-lockin").onclick = () => show("lockin");

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
if (ONLY) {
  document.querySelector(".tabs").hidden = true;
  document.querySelector("h1").textContent = ONLY === "socket" ? "Smart socket in its case" : "Lock-in amplifier in its case";
  document.title = ONLY === "socket" ? "Smart socket 3D" : "Lock-in 3D";
}
show(ONLY || "socket");
</script>
</body>
</html>
